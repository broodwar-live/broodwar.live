{% extends "base.html" %}
{% block title %}404 — Page not found{% endblock %}

{% block content %}
<section class="asl-gradient-bg hero-streaks hero-glow relative overflow-hidden">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-28 relative z-10 text-center">
    <p class="font-stats text-6xl lg:text-8xl font-bold text-primary/70">404</p>
    <h1 class="mt-6 text-2xl font-display">Page not found</h1>
    <p class="mt-1 text-sm text-base-content/40" lang="ko">페이지를 찾을 수 없습니다</p>
    <p class="mt-6 text-sm text-base-content/50 leading-relaxed max-w-md mx-auto">
      This page doesn't exist — it may have moved, or the link may be wrong.
      <span lang="ko" class="block mt-1 text-base-content/35">페이지가 이동했거나 링크가 잘못되었을 수 있습니다.</span>
    </p>
    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
      <a href="/" class="btn btn-primary">Home</a>
      <a href="/ko/" class="btn btn-primary btn-soft" lang="ko">홈으로</a>
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('search-toggle')?.click()">Search · 검색</button>
    </div>
    <div class="mt-10 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-xs text-base-content/40">
      <a href="/players/" class="hover:text-base-content/70">Players</a>
      <a href="/builds/" class="hover:text-base-content/70">Builds</a>
      <a href="/tournaments/" class="hover:text-base-content/70">Tournaments</a>
      <a href="/wiki/" class="hover:text-base-content/70">Wiki</a>
    </div>
  </div>
</section>
{% endblock %}
