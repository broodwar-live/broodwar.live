base_url = "https://broodwar.live"
title = "broodwar.live"
description = "The community platform for StarCraft: Brood War competitive play."
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = false
minify_html = true

[languages.ko]
title = "broodwar.live"
description = "스타크래프트: 브루드 워 경쟁 커뮤니티 플랫폼."
build_search_index = true
generate_feeds = false
taxonomies = [{name = "race", feed = false}, {name = "matchup", feed = false}, {name = "tags", feed = false}]

# KO search index: titles and descriptions only, like the default language.
[languages.ko.search]
include_title = true
include_description = true
include_content = false

[[taxonomies]]
name = "race"
feed = false

[[taxonomies]]
name = "matchup"
feed = false

[[taxonomies]]
name = "tags"
feed = false

# Keep the client-side index small (~340 KB vs ~3.8 MB with full bodies):
# index titles and descriptions only.
[search]
include_title = true
include_description = true
include_content = false

[slugify]
paths = "safe"
taxonomies = "safe"
anchors = "safe"

[markdown]
insert_anchor_links = "heading"

[extra]
# The JSON API (api.broodwar.live) is not deployed yet. While this is false,
# API-backed pages and widgets render a "coming soon" state and load no JS.
api_enabled = false
api_base_url = "https://api.broodwar.live"
github_repo = "https://github.com/broodwar-live/broodwar.live"
github_content_base = "https://github.com/broodwar-live/broodwar.live/edit/main/content"

