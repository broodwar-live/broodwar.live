base_url = "https://broodwar.live"
title = "broodwar.live"
description = "The community platform for StarCraft: Brood War competitive play."
default_language = "en"
compile_sass = false
# Search uses a custom JSON index (templates/search.json, rendered through the
# feed mechanism as /search.json and /ko/search.json) instead of elasticlunr:
# it carries types and cross-language names/aliases and stays small.
build_search_index = false
generate_feeds = true
feed_filenames = ["search.json"]
minify_html = true

[languages.ko]
title = "broodwar.live"
description = "스타크래프트: 브루드 워 경쟁 커뮤니티 플랫폼."
build_search_index = false
generate_feeds = true
feed_filenames = ["search.json"]
taxonomies = [{name = "race", feed = false}, {name = "matchup", feed = false}, {name = "tags", feed = false}]

[[taxonomies]]
name = "race"
feed = false

[[taxonomies]]
name = "matchup"
feed = false

[[taxonomies]]
name = "tags"
feed = false

[slugify]
paths = "safe"
taxonomies = "safe"
anchors = "safe"

[markdown]
insert_anchor_links = "heading"

[extra]
# The JSON API (api.broodwar.live) is not deployed yet. While this is false,
# API-backed pages and widgets render a "coming soon" state and load no JS.
api_enabled = false
api_base_url = "https://api.broodwar.live"
github_repo = "https://github.com/broodwar-live/broodwar.live"
github_content_base = "https://github.com/broodwar-live/broodwar.live/edit/main/content"

